version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: recruitment_db
    environment:
      POSTGRES_USER: recruitment_user
      POSTGRES_PASSWORD: recruitment_password
      POSTGRES_DB: recruitment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruitment_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: recruitment_api
    environment:
      DATABASE_URL: postgresql://recruitment_user:recruitment_password@db/recruitment_db
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      AI_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
